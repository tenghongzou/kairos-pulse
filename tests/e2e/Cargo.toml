[package]
name = "kp-e2e"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
# 只供測試：以實際編譯出的 kairos 與 pulse 執行檔跑端對端測試（審計 Q1），不發佈也不打包
publish = false
description = "Kairos + Pulse end-to-end tests (spawns the real binaries)"

[lib]
# 測試輔助程式（行程管理、暫存目錄、設定與 PKI）；本身沒有單元測試與文件測試
test = false
doctest = false

[dependencies]
# 解析 Kairos 寫出的 reports-*.jsonl 與 agents.json；與 kairos、pulse 使用的版本相同（不新增依賴）
serde_json = "1"
# 協定 v1 的假 client（模擬舊版 Pulse）以 mTLS 連上實際的 Kairos；與 kairos、pulse 經 tokio-rustls
# 使用的版本與加密後端（ring）相同，Cargo.lock 不新增外部套件
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
# 測試用的連接埠：綁定但不監聽地佔住，直到 Kairos 啟動的那一刻才釋放（src/lib.rs 的 free_port）；
# tokio 已依賴同一個版本，Cargo.lock 不新增外部套件
socket2 = "0.6"

[dev-dependencies]
# 註冊通道（8444）的 e2e 測試：以共用型別組請求、以 rcgen 產生根 CA、伺服器憑證與 CSR（與 kairos 使用的版本
# 與加密後端相同，Cargo.lock 不新增外部套件）
kairos-proto = { path = "../../crates/kairos-proto" }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }
# rcgen 的日期型別（與 rcgen 使用的版本相同）
time = { version = "0.3", default-features = false, features = ["std"] }
