# Pulse 設定範例與預設值
#
# 這份檔案有兩種用途，內容相同：
#   - 原始碼中的 config.toml：編譯時嵌入執行檔，作為所有欄位的預設值。
#   - 發佈包中的 pulse.example.toml：供參考的範例，程式「不會」讀取這個檔名。
#
# 如何修改設定（不要直接修改本檔，修改它不會生效）：
#   1. 在 Pulse 的工作目錄下另外建立 pulse.toml。
#   2. 只寫要覆蓋的欄位，其餘沿用內建預設值；不需要把整份檔案複製過去。例如：
#        [server]
#        address = "kairos.example.com"
#        domain = "kairos.example.com"
#   3. 也可以改用環境變數 PULSE__<SECTION>__<KEY>，例如 PULSE__SERVER__PORT=9000
#      （環境變數的值一律當字串讀入：數值與布林欄位再轉成對應型別，
#       路徑、domain、address 等字串欄位保持原樣，例如 0001 不會變成 1）
#
# 載入順序（後者覆蓋前者）：內建預設值（本檔內容）→ 工作目錄下的 pulse.toml（可省略）→ PULSE__* 環境變數
#
# 設定中的相對路徑一律以「目前工作目錄」解析；啟動時會在日誌記錄工作目錄與是否讀到 pulse.toml。
# 以 systemd 執行時請設定 WorkingDirectory；以 Windows 服務執行時預設工作目錄是 C:\Windows\System32，
# 請在服務設定中指定工作目錄。

[server]
address = "127.0.0.1"  # 不可為空字串
port = 8080            # 1～65535
# TLS 用的主機名稱（SNI / 憑證 SAN 驗證）；正式環境請填實際伺服器域名
domain = "localhost"
# 是否略過 TLS 憑證驗證。⚠️ 僅供開發測試，正式環境務必維持 false，
# 否則容易遭中間人攻擊。使用自簽憑證時請改用下方的 ca_cert。
accept_invalid_certs = false
# 信任的 CA 或自簽憑證（PEM，可含多張）路徑；空字串 = 只使用作業系統信任庫。
# 非空時於啟動時讀取，讀不到檔案或格式錯誤會直接結束程式。
ca_cert = ""
# 是否同時信任作業系統信任庫。預設不寫：依是否設定 ca_cert 決定——
#   - 設定了 ca_cert（私有 CA）→ 只信任 ca_cert，不信任作業系統信任庫，
#     避免任何公開 CA 簽發的同名憑證也被接受；
#   - 未設定 ca_cert → 信任作業系統信任庫（伺服器憑證由公開 CA 簽發）。
# 明確設定時以設定為準：設定了 ca_cert 又需要信任公開 CA 時設為 true；
# 設為 false 時 ca_cert 必填，否則啟動即報錯。
# use_system_roots = true
# mTLS 客戶端憑證（伺服器要求客戶端憑證時才需要）。兩者須同時設定或同時留空。
# 憑證的 SAN 必須是 DNS:<本機 agent_id>（可用 `pulse --print-agent-id` 取得），EKU 需含 clientAuth。
client_cert = ""   # 客戶端憑證 PEM：第一張為客戶端憑證本身，之後可接中繼 CA（整條鏈都會送出）
client_key = ""    # 對應私鑰 PEM：PKCS#8 / PKCS#1 / SEC1 皆可，支援 RSA、ECDSA P-256 / P-384、Ed25519；
                   # 不可加密。與憑證不成對時啟動即報錯；權限過寬時記 WARN（規則同 agent.id）
# 啟動時與之後每 24 小時檢查客戶端憑證鏈的有效期限：已過期 → 記 ERROR（仍會繼續嘗試連線，
# 以伺服器的判定為準；也請確認本機時鐘是否正確）；尚未生效或 30 天內到期 → 記 WARN

[retry]
# 連續連線失敗達此次數後，重連日誌由 warn 升級為 error（重試本身不設上限）；
# error 每 10 分鐘最多一則，其餘改記 warn（伺服器長時間停機時避免洗版）
max_retries = 5
initial_delay = 2  # 第一次重連前的延遲（秒，1～3600），之後每次加倍
max_delay = 60     # 重連延遲上限（秒，1～3600）；實際延遲另加 ±20% 抖動（不超過此上限）
# 註冊後連線穩定維持 30 秒以上才會重置退避；更早斷線仍視為連續失敗。
# 因 superseded（被同一 agent_id 的其他連線取代）而斷線：第一次照上述規則處理；
# 連續第 2 次起不論維持多久都不重置退避，且該次延遲至少 30 秒（不受 max_delay 上限限制）

[heartbeat]
# 心跳間隔（秒，1～60）。伺服器的離線判定為 max(5 × interval, 5 秒)（預設 75 秒）。
# 讀取閒置逾時 = max(2 × interval, interval + 10 秒)（預設 30 秒），只依心跳間隔計算，與 report.interval 無關。
# 啟動時與斷線後第一次重連前，另加 0～min(interval, 5) 秒的隨機延遲，避免大量 agent 同時連線
interval = 15

[report]
# 系統資訊回報間隔（秒，1～3600）。CPU 使用率為上次取樣到這次取樣之間的平均（略過回報時仍會取樣）。
# 啟用本機緩衝且 Kairos 支援 durable 時，取樣先寫進緩衝、依序送出（見 [buffer]）；
# 否則（at-most-once）上一筆 report 尚未收到伺服器回應（ack 或 error）時，略過這次取樣（記 WARN，有節流）
interval = 5

[agent]
# 存放 agent_id（UUID v4）的檔案；第一次啟動時自動產生，之後沿用。
# 內容須為 8-4-4-4-12 格式的 UUID（大小寫皆可，讀入後一律轉小寫），不合法或超過 1024 bytes
# 時啟動即報錯（刪除檔案可重新產生）。未啟用 mTLS 時 agent_id 等同身分憑據，請妥善保護：
# Unix 上新建的檔案權限為 0600。啟動時檢查權限，過寬時記 WARN（Unix：群組或其他使用者有權限，
# 擁有者為 root 時允許群組可讀；Windows：ACL 允許 Users、Everyone 等一般使用者存取）
id_file = "agent.id"
# 主控台的顯示名稱（1～255 bytes；空字串 = 不送，主控台以主機名稱顯示）與標籤
# （最多 32 個、每個 1～64 bytes、不得重複，例如 ["env:prod", "team:web"]）。
# 只在 Kairos 支援協定 v2 時送出；不得含控制字元、零寬空格等不可見字元，不符時啟動即報錯。
# tags 只能在 pulse.toml 設定（環境變數不支援陣列）
display_name = ""
tags = []

[identity]
# 以 pulse enroll 註冊取得的身分檔案目錄（相對路徑以工作目錄解析）：client.key、client.pem、ca.pem、
# enrollment.json（註冊與續簽的進度，含輪詢憑據）。Unix 上以 0700 建立、私鑰與 enrollment.json 為 0600；
# Windows 只允許 SYSTEM 與 Administrators 存取。服務帳號必須能寫入（systemd unit 的 ReadWritePaths）
dir = "identity"
# 自動更新用戶端憑證（Kairos 支援協定 feature「renew」時，經 8443 送出新的 CSR）：
# 已使用壽命的 2/3，或剩餘天數 ≤ 此值時開始更新，取較早者（0～365；0 = 只看 2/3）
renew_before_days = 30

[enroll]
# 註冊端點（8444，HTTPS）。過期寬限期續簽與 pulse enroll（未指定 --enroll-server 時）使用。
# 空字串 = 與 server.address 相同的主機（decisions/naming.md §4.2）
address = ""
port = 8444

[buffer]
# 本機緩衝（at-least-once）：取樣先寫進本機磁碟，收到 Kairos 的確認（ack）才刪除；
# 斷線、Kairos 停機維護或寫入結果不明時資料留在緩衝中，重新連上後依序補送，再送新的取樣。
# 需要 Kairos 0.3.0 以上（協定 feature「durable」）；連上舊版 Kairos 時照舊即時送出、送不出去就丟棄，
# 緩衝中的積壓保留到連上新版 Kairos 為止。設為 false 時與 0.2.0 相同（不寫磁碟、不補送）。
enabled = true
# 緩衝目錄（相對路徑以工作目錄解析）。Unix 上以 0750 建立、檔案為 0640；
# 目錄允許其他使用者（Windows：一般使用者）存取時記 WARN。同一個目錄只能給一個 Pulse 使用
dir = "buffer"
# 待送資料的上限，先到者為準；超過時丟掉最舊的資料並記 WARN（計入丟棄筆數）。
# 一筆約 1.5～5 KB（視磁碟、網路介面與溫度感測器的數量而定；帶行程排行的那筆再多約 1 KB），
# 預設每 5 秒一筆時，50000 筆約 69 小時、128 MiB 約 2～3 天。磁碟用量最多約 max_mb 再加 8 MiB
# （0.8.0 起預設由 64 改為 128：每筆記錄因新增的指標變大，METRICS.md 第 17 節 D7）
max_mb = 128             # MiB，1～102400
max_records = 50000      # 筆，100～10000000
# 取樣時間超過這麼久的資料不再送出、直接丟棄（小時，1～8760；預設 7 天）
max_age_hours = 168
# 兩筆 report 之間的最短間隔（毫秒，500～60000）。補送積壓時以這個速率送出（預設每秒約 0.83 筆，
# 低於 Kairos 的 report 速率限制每秒 2 則；1 萬台同時恢復連線時約每秒 8,300 筆）。實際使用的值不超過
# report.interval 的 60%（report.interval = 1 時為 600），否則新的取樣比送出的快、積壓補不完
replay_interval_ms = 1200

[collect]
# 標準指標的採集範圍（METRICS.md 第 3、4 節；協商了 metrics 的 Kairos 0.2.0 以上才送）。
# CPU、記憶體、負載（只有 Linux）、置換空間、行程數、開機時間一律送；以下各類可個別關閉。
# 虛擬檔案系統（tmpfs、overlay、squashfs…）、容量為 0 與重複的掛載點、loopback 與虛擬網路介面
# （veth*、docker*、br-*、virbr*、cni*、flannel*、cali*…）一律不送
filesystems = true     # system.filesystem.*（每個掛載點：total、available、used、usage）
disk_io = true         # system.disk.*（每個裝置的累計讀寫量；Linux 另有讀寫次數與忙碌時間）
network = true         # system.network.*（每個介面的累計收發位元組、封包與錯誤數）
temperature = true     # system.temperature
# 每類的上限（每筆 report 最多 256 個指標，Kairos 0.7.0 以前超過就整筆拒絕，因此不可再提高）；
# 0 = 不送該類。超過上限時依優先順序保留：掛載點為 /（Windows 為系統磁碟機）→ 容量大者；
# 磁碟 I/O 裝置依掛載點的順序；介面為有 IPv4 位址者 → 累計流量大者。
# 被略過的項目在啟動後第一次取樣時記一則 INFO（sysinfo.snapshot），之後每 24 小時最多一則
max_filesystems = 16   # 0～16
max_disks = 8          # 0～8
max_interfaces = 16    # 0～16
# 額外排除的網路介面（glob，* 與 ?，區分大小寫；最多 32 個）。只能在 pulse.toml 設定（環境變數不支援陣列），
# 例如 ["tap*", "wg?"]
interface_exclude = []

[processes]
# 行程數（system.process.count）與行程排行（Kairos 0.8.0 以上、SQLite 儲存時協商 feature「processes」）。
# false = 不宣告 processes，也不送行程數
enabled = true
# 行程排行的間隔（秒，1～3600；實際不小於 report.interval）。排行附在當時的 report 上，
# CPU 使用率為兩次排行之間的平均（占整台主機的百分比）
interval = 60
# 依 CPU、依記憶體（常駐記憶體）各取幾個行程（1～10）
top = 5
# 命令列：參數常含密碼、token、連線字串，預設不送（METRICS.md 第 8 節）
#   none        不送（只送執行檔名稱，例如 postgres）
#   executable  只送執行檔的完整路徑（不含參數；Linux 讀不到其他使用者行程的路徑時改用命令列的第一段）
#   full        送完整命令列（含參數，截斷到 1024 bytes）。Kairos 不做遮罩，主控台會提示可能含敏感資訊
command = "none"
# 送行程的使用者名稱：本版尚未實作（METRICS.md 第 17 節 D3），設為 true 只會記一則 WARN
include_user = false

[inventory]
# 主機資產：作業系統、CPU、記憶體、廠牌型號、序號、BIOS、磁碟、網卡 MAC／IP
# （Kairos 0.8.0 以上、SQLite 儲存時協商 feature「inventory」）。連線後送一次，之後內容改變才送，
# 距離上次送達滿 24 小時也送一次。false = 不宣告 inventory、不收集
enabled = true
# 重新收集資產的間隔（秒，300～86400）
interval = 3600
# 送系統序號（SMBIOS）。Linux 的序號只有 root 能讀：發佈包的 pulse.service 在啟動前以
# ExecStartPre=+ 複製到 /run/pulse/product_serial；讀不到時不送並記一則 INFO（PLS-I8009）
hardware_serials = true
# 送網路介面的 MAC 與 IP 位址
network_addresses = true

[status]
# 本機狀態檔（pulse status 讀取）。執行中每 10 秒、狀態變化時另外以原子方式改寫（寫暫存檔再改名，不 fsync）。
# 所有人可讀（pulse status 不需要 root）：Unix 上檔案 0644；Windows 另外授予 Users 讀取。內容不含秘密，
# 未啟用 mTLS 時也不寫 agent_id。
# 空字串 = 預設位置：Linux /var/lib/pulse/status.json（systemd unit 的 StateDirectory=pulse 建立），
# Windows %ProgramData%\Pulse\status.json。預設位置無法寫入時（例如沿用沒有 StateDirectory= 的舊 unit）
# 改寫在工作目錄的 logs/status.json 並記 WARN（PLS-E8204），服務照常執行。
# 指定路徑時（相對路徑以工作目錄解析）只寫該位置；多實例請各自指定，例如 "/var/lib/pulse/2/status.json"
file = ""

[log]
level = "info"  # 日誌級別（trace, debug, info, warn, error；不分大小寫，其他值啟動即報錯）
# 日誌檔按日分檔：logs/pulse-YYYY-MM-DD.log（檔名日期為 UTC）。
# 保留今天與前 N 天，更早的於啟動時與每小時清除；0 = 永久保留，上限 3650。
# 清除前會檢查系統日期是否合理：日期前進得比實際經過的時間多（例如時鐘被誤校到未來）時暫停清除，
# 同一日期持續 24 小時後才接受。狀態存在 logs/.retention-guard.json，請勿刪除
retention_days = 14
# 每一行的格式：
#   text   （預設）2026-10-14T14:22:16.123+08:00 [WARN] buffer.full PLS-W4202 本機緩衝已滿…
#          時間為 RFC 3339、毫秒、帶時區位移；其餘與 0.5 相同（[等級]、有固定事件的行以「事件 代碼」開頭）
#   json   一行一個 JSON（NDJSON，時間一律 UTC），檔名改為 logs/pulse-YYYY-MM-DD.jsonl；固定欄位
#          v、ts、level、event、code、msg、agent_id、instance、product、host、run_id、seq、target、fields，
#          供 SIEM 直接收集（rsyslog imfile、Filebeat、Fluent Bit），規則只依 event、code 判斷，不依訊息文字
#   legacy 0.5 以前的格式（2026-10-14 14:22:16 [WARN] …，本地時間不帶時區），只保留一個主要版本供過渡
format = "text"
# text 的時間：local（本機時區，預設）或 utc（以 Z 結尾）。json 一律 UTC，legacy 一律本機時間
timezone = "local"
# 同時寫到 stdout（與日誌檔相同的格式）。以 systemd 執行時 stdout 由 unit 決定：
# 發佈包的 pulse.service 為 StandardOutput=null（只保留日誌檔一份）；要讓 journald 收集時見 INSTALL.md
stdout = true

[log.syslog]
# 外送到 syslog（RFC 5424）：udp://主機:埠（預設埠 514）、tcp://主機:埠（預設埠 601，RFC 6587 octet counting）、
# unix:///dev/log（本機 socket，需要 rsyslog／syslog-ng 以 RFC 5424 解析）；空字串＝不外送（預設）。
# 在背景送出：接收端無法連線時丟棄並計數（metrics 的 pulse_log_syslog_messages_total），不影響服務與日誌檔
target = ""
facility = "daemon"   # daemon、user、auth、authpriv、local0～local7
app_name = "pulse"    # RFC 5424 的 APP-NAME
payload = "text"      # text：訊息文字；json：與 format = "json" 相同的一行 JSON

[metrics]
# 本機的 Prometheus 指標（連線狀態、送出／ack／補送佇列、取樣耗時與逾時）。預設都關閉。
# 本機 HTTP /metrics：只接受 loopback 位址（不需要認證，不對外開放），例如 "127.0.0.1:9465"
listen = ""
# 或寫成 node_exporter textfile collector 的檔案（副檔名必須是 .prom，例如
# "/var/lib/node_exporter/textfile_collector/pulse.prom"；以寫暫存檔再改名的方式原子更新）
textfile = ""
textfile_interval = 15   # textfile 的更新間隔（秒，5～3600）
