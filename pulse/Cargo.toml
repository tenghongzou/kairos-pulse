[package]
name = "pulse"
version = "0.13.0"
edition = "2024"
rust-version = "1.99"
# 商業產品，不發佈到 crates.io（cargo-deny 因此略過本套件的授權欄位檢查）
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# 日期時間：日誌時間戳記、協定 ts、日誌檔名（UTC 日期）
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 設定疊加（嵌入預設 → pulse.toml → 環境變數），只需要 TOML
config = { version = "0.15", default-features = false, features = ["toml"] }
# 日誌輸出；date-based：按日分檔（logs/pulse-YYYY-MM-DD.log，UTC 日期）
fern = { version = "0.7", features = ["date-based"] }
# 與 Kairos 共用的日誌清除時鐘跳躍保護（workspace 內部 crate）
date-guard = { path = "../crates/date-guard" }
# 與 Pulse／Kairos 共用的可觀測性元件：日誌格式、syslog、Prometheus 文字格式、診斷包（workspace 內部 crate）
kp-obs = { path = "../crates/kp-obs" }
# 與 Kairos 共用的協定型別與驗證（workspace 內部 crate）
kairos-proto = { path = "../crates/kairos-proto" }
# SinkExt / StreamExt
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
log = "0.4"
# 載入作業系統信任庫（Windows 憑證存放區 / macOS Keychain / Linux CA bundle）給 rustls 使用
rustls-native-certs = "0.8"
# 辨識 rustls 包在 CertificateError::Other 中的 webpki 錯誤（例如 CaUsedAsEndEntity）以給出具體提示；
# 與 rustls 依賴的版本相同，只啟用 alloc（不引入其他加密後端）
rustls-webpki = { version = "0.103", default-features = false, features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 只啟用實際用到的系統資訊類別
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "network", "component"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "fs"] }
# TLS（與 Kairos 相同）：使用 ring 作為加密後端，避免 aws-lc-rs 在 Windows 上需要額外的 C 建置工具
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
# NDJSON 分行（LinesCodec + Framed）與 CancellationToken
tokio-util = { version = "0.7", features = ["codec"] }
# agent_id 產生
uuid = { version = "1.27", features = ["v4"] }
# 註冊通道（ENROLL.md 15.3 節選定）：在本機產生 P-256 私鑰（ring）與 CSR（rcgen，以 ring 為後端，
# 不引入 aws-lc-rs）；兩者都已在依賴樹（rustls、kairos-proto 的測試）
ring = "0.17"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

# Linux：statvfs（檔案系統的 f_bfree，METRICS.md 的 system.filesystem.used = total − free）。
# 不是新依賴：tokio、ring、sysinfo 已依賴同一個版本
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# 預設沒有任何 feature。
default = []
# 只給 tests/systemd/（crates/kairos-proto/REMOTE.md 第 17.9.9 節）：升級輔助程式在指定的當機點停住，讓測試
# 腳本終止整台主機。**正式發佈的執行檔不得開啟**：packaging/build-release-common.sh 檢查產物不含它的標記
# 字串，packaging/release.sh 在設定了 TEST_FEATURES 時拒絕執行；開啟時 `pulse --version` 另有
# `[fault-injection]`
fault-injection = []

[dev-dependencies]
# 不是新依賴：只為測試多開 tokio 的 test-util（tokio::time::pause / 自動推進時間）
tokio = { version = "1.53", features = ["test-util"] }
# 不是新依賴（rcgen 的依賴）：測試用的假 8444 伺服器以指定的時間簽發憑證
time = "0.3"

# Windows 服務（商業審計 O4；pulse service install|uninstall|run，src/winsvc.rs）：服務控制管理員的註冊與
# 服務進入點。MIT／Apache-2.0；依賴的 windows-sys 0.61 已在依賴樹中，另外只多 widestring
[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
