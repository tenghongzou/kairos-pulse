[package]
name = "pulse"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
sysinfo = "0.32.1"
serde = { version = "1.0", features = ["derive"] } # 用於序列化與反序列化
tokio = { version = "1.41.1", features = ["full"] }
tokio-native-tls = "0.3"    # 支援 TLS 通訊
native-tls = "0.2"          # TLS 底層實現
chrono = "0.4.38"
serde_json = "1.0"
log = "0.4.22"
env_logger = "0.11.5"