[server]
listen = "127.0.0.1:8080"     # 部署成中央伺服器時改成 0.0.0.0:8080，並同時設定 [auth] client_ca 啟用 mTLS（未啟用 mTLS 又監聽非 loopback 位址時拒絕啟動）
cert_path = "cert.pem"
key_path = "key.pem"
max_connections = 1024
# max_connections_per_ip = 32 # 每個來源 IP 位址的連線數上限，1..=max_connections；未設定時為 min(32, max_connections)。未啟用 mTLS：計算全部連線（含握手中）；啟用 mTLS：只計算尚未通過 hello 的連線（握手前保護），通過後改依憑證身分計數，同一 NAT 後的 agent 數不受此限（IPv6 以單一位址計，新連線速率才以 /64 合併）
per_ip_allowlist = []         # 每 IP 上限的網段允許清單（CIDR，IPv4／IPv6，只寫位址表示單一位址），例如 ["203.0.113.10", "10.20.0.0/16"]；清單內的位址改用下一項的上限
# max_connections_per_allowlisted_ip = 4096 # 允許清單內每個位址的上限，1..=65535；實際上限為 min(此值, max_connections)。清單非空且此值大於 max_connections 時啟動記 WARN；清單為空時不生效
reload_interval_secs = 30     # 每隔幾秒檢查憑證／私鑰／客戶端 CA／CRL 是否變更並重新驗證現役連線，0 = 停用，上限 3600
cert_expiry_warning_days = 30 # 伺服器憑證到期前幾天開始記 WARN（啟動、重載與每個重載週期檢查），0 = 不預警（已過期仍記 ERROR），上限 365

[timeouts]
handshake_secs = 5
hello_secs = 5
write_secs = 5                # 寫出訊息與等待 report 寫檔的上限，1..=6（伺服器最壞回應延遲 7.55 秒，須小於 Pulse 讀取閒置 max(2h, h+10 秒) 中的 10 秒餘裕，h = 心跳間隔）

[storage]
data_dir = "data"
backend = "sqlite"            # report 的儲存：sqlite（<data_dir>/kairos.db：原始資料、彙總與主機清冊）或 jsonl（舊版的按日 JSONL，沒有主機清冊與彙總）；說明見 STORAGE.md
jsonl_mirror = false          # backend = "sqlite" 時另外輸出 JSONL 鏡像 reports-YYYY-MM-DD.jsonl（盡力而為，不影響 ack）
raw_retention_days = 7        # SQLite 原始 report 保留天數（今天與前 N 天，UTC），0 = 不依時間刪除，上限 3650
rollup_5m_retention_days = 31 # 5 分鐘彙總（min/max/sum/count）保留天數，0 = 不依時間刪除
rollup_1h_retention_days = 400 # 1 小時彙總保留天數，0 = 不依時間刪除
max_total_bytes = 68719476736 # SQLite 資料庫的總容量上限（bytes，預設 64 GiB；0 = 不限制，否則至少 64 MiB）；超過時依序刪除最舊的原始 report、5 分鐘彙總、1 小時彙總。小於估算量時啟動會記 WARN
sqlite_synchronous = "normal" # normal：commit 寫入作業系統即 ack（與 JSONL 相同，斷電可能遺失最後幾個交易）；full：每次 commit 都 fsync
# max_hosts = 100000          # 主機清冊最多幾台（limits.max_agents..=1000000）；未設定時為 max(100000, limits.max_agents)
max_series_per_host = 2048    # 每台主機最多幾個指標序列（64～65536；含速率與推算序列）；超過時新序列的指標不保存（KRS-W4104），其他照存
retention_days = 30           # JSONL（backend = "jsonl" 或鏡像）reports-YYYY-MM-DD.jsonl 保留天數（今天與前 N 天），0 = 永久保留，上限 3650
max_daily_bytes = 0           # 每個 reports-YYYY-MM-DD.jsonl 的大小上限（bytes），0 = 不限制；backend = "jsonl" 時達到後當天的 report 回 storage_unavailable（鏡像只是不再寫入鏡像）。寫 JSONL 且設定值小於 max_connections × 每秒 1 則 × 約 250 bytes × 86400 時，啟動會記 WARN

[auth]
client_ca = ""                # 非空：要求客戶端憑證（mTLS），以此 PEM（可含多張 CA）驗證，並強制 agent_id 綁定
crl = []                      # CRL 檔路徑清單（PEM 或 DER），例如 ["agents.crl"]；只在設定 client_ca 時有效
allow_multiple_dns_sans = false  # false：客戶端憑證必須恰好有一個 DNS SAN（避免一張憑證冒用多個 agent）
crl_expiry_warning_days = 7   # CRL 的 nextUpdate 前幾天開始記 WARN（過期後所有 agent 都會被拒絕），0 = 不預警（已過期仍記 ERROR），上限 365
allow_unauthenticated = false # false：未設定 client_ca 又監聽非 loopback 位址（例如 0.0.0.0）時拒絕啟動。true 只用於隔離的測試環境：任何人都能以任意 agent_id 註冊

[limits]
# max_agents = 10000          # 狀態表最多保留幾個 agent（達上限先淘汰離線最久者），max_connections..=100000；未設定時為 max(10000, max_connections)

[log]
level = "info"
retention_days = 14           # logs/kairos-YYYY-MM-DD.log（UTC 日期）保留天數，0 = 永久保留，上限 3650
format = "text"               # text：2026-10-14T14:22:16.123+08:00 [WARN] 訊息（RFC 3339 帶時區）；
                              # json：一行一個 JSON（UTC），檔名改為 logs/kairos-YYYY-MM-DD.jsonl，固定欄位 v、ts、level、
                              #       event、code、msg、product、host、run_id、seq、target、fields（README「日誌」）；
                              # legacy：0.5 以前的格式（2026-10-14 14:22:16 [WARN] 訊息，本地時間不帶時區），過渡用
timezone = "local"            # text 的時間：local（本機時區）或 utc；json 一律 UTC，legacy 一律本機時間
stdout = true                 # 同時寫到 stdout（以 systemd 執行時進 journal）；只要日誌檔一份時設為 false

[log.syslog]                  # 外送到 syslog（RFC 5424）；預設不外送
target = ""                   # udp://主機:埠（預設 514）、tcp://主機:埠（預設 601，RFC 6587 octet counting）、unix:///dev/log
facility = "daemon"           # daemon、user、auth、authpriv、local0～local7
app_name = "kairos"           # RFC 5424 的 APP-NAME
payload = "text"              # text：訊息文字；json：與 format = "json" 相同的一行 JSON（SIEM 依 event、code 欄位判斷）

[observability]               # /healthz、/readyz、/metrics（README「健康檢查與 Prometheus」）
listen = ""                   # 另外以純 HTTP 監聽這三個端點，例如 "127.0.0.1:9464"；空字串＝只在主控台的監聽上提供
on_console = true             # 主控台的監聽（console.listen，HTTPS）也提供這三個端點
metrics_token_file = ""       # /metrics 的 bearer token 檔（一行，至少 16 個字元，例如 openssl rand -hex 32 > metrics.token）；
                              # 未設定時 /metrics 只接受 loopback 來源。/healthz、/readyz 不需要認證，只回傳狀態字

[console]                     # 主控台 API（HTTPS，/api/v1，見 API.md）；需要 storage.backend = "sqlite"
enabled = true                # false：不監聽主控台連接埠
listen = "127.0.0.1:9443"     # 預設只綁 loopback；開放給管理網段時改成 0.0.0.0:9443，並以防火牆只允許管理網段。不可與 server.listen 相同（KRS-E0202）
cert_path = ""                # 主控台的伺服器憑證；空字串時沿用 server.cert_path（瀏覽器要信任時建議另設 SAN 為主控台網址的憑證）
key_path = ""                 # 與 cert_path 同時設定或同時留空；依 server.reload_interval_secs 熱重載
max_connections = 64          # 主控台的同時連線上限（含 SSE），1..=4096；計入 LimitNOFILE 的需要量（server.max_connections + 此值 + 64）
max_streams = 16              # 即時推送（SSE，/api/v1/events）的同時連線上限，1..=max_connections

[enroll]                      # 註冊通道（8444，HTTPS；crates/kairos-proto/ENROLL.md）；需要 SQLite、auth.client_ca 與 pki.server_ca_path
# mode = "open"               # open（受理新註冊與過期續簽）／renew_only（只受理過期續簽）／closed（不監聽）；沒有設定時為 closed（KRS-I2010）。主控台或 kairos enroll mode 修改的值存在資料庫、優先於這裡
auto_pause_enabled = true     # open 時連續 auto_pause_after_hours 小時沒有有效 token 就自動暫停新註冊（建立 token 時解除）
auto_pause_after_hours = 24   # 1..=168
listen = ""                   # 空字串：與 server.listen 同一個 IP、連接埠 8444；不可與 server.listen、console.listen 相同（KRS-E0202）
advertise = ""                # 對外公告的註冊端點 host:port（安裝字串的 e、簽章內容的名稱之一）；空字串時不另外公告
cert_path = ""                # 8444 的伺服器憑證；空字串時沿用 server.cert_path（鏈中沒有 pki.server_ca_path 的 CA 時自動接在鏈尾）
key_path = ""
max_connections = 1024        # L1：同時連線（握手中＝一半）；計入 LimitNOFILE 的需要量
max_new_connections_per_sec = 200   # L1：全域新連線速率／可連續
max_new_connections_burst = 1000
max_connections_per_ip = 64   # L2
max_new_connections_per_ip_per_sec = 20   # L3 軟上限（超過回 429；硬上限 4 倍，握手前關閉）
max_new_connections_per_ip_burst = 200
max_requests_per_ip_per_minute = 600   # L4：每個來源的 server-info、token-check、新註冊
max_requests_per_ip_burst = 600
max_renewals_per_ip_per_minute = 600   # L4r：每個來源的過期續簽
max_renewals_per_ip_burst = 600
token_min_drain_secs = 300    # L5：每個 token 最快多少秒用完（批次部署模式固定 60）；0 = 不限
max_requests_per_token_burst = 100
max_outside_subnet_requests_per_token_per_hour = 10   # L5b
max_requests_per_agent_per_minute = 1   # L6
max_requests_per_agent_burst = 5
max_renewals_per_agent_per_hour = 10    # L6r
max_invalid_tokens_per_ip = 20     # L7：時間窗內相異的無效值達此數就封鎖該來源（新註冊類、續簽類分開）
max_invalid_renewals_per_ip = 20
invalid_window_secs = 3600
block_initial_secs = 900      # 封鎖時間；再犯加倍，上限 block_max_secs；封鎖寫入資料庫
block_max_secs = 86400
max_requests_per_sec = 50     # L8：全域申請速率（新註冊與過期續簽合計）
max_requests_burst = 500
max_pending = 20000           # L9：待核准佇列上限
poll_min_interval_secs = 10   # L10：同一筆申請兩次輪詢的最短間隔（可連續 3 次）
poll_after_base_secs = 30     # 動態 poll_after_ms ＝ max(基準, 同一來源待核准筆數 ÷ 目標速率)，上限
poll_after_max_secs = 900
poll_target_per_ip_per_sec = 5
long_poll_secs = 60           # 長輪詢上限（0 = 停用）
max_long_polls_per_ip = 32
max_long_polls = 1000
max_downloads_per_ip = 8      # L11（本版下載端點回 404）
max_downloads = 64
batch_sources = []            # 批次部署來源（CIDR）：L2、L3、L4、L11 乘以 batch_source_multiplier
batch_source_multiplier = 10
retry_after_max_secs = 600    # 429／503 的 Retry-After 上限（L7 封鎖與 L9 除外）
header_timeout_secs = 10
idle_timeout_secs = 15
max_body_bytes = 65536
request_expiry_days = 7       # 待核准申請的有效期限

[pki]                         # PKI（kairos/PKI.md）
# mode = "online"             # online（Kairos 持有簽發 CA 私鑰，核准後立即簽發；預設建議）／offline（匯出 CSR 佇列、在 CA 主機簽發後匯入）；沒有設定時為 offline
server_ca_path = ""           # Pulse 信任的 CA（根 CA）：安裝字串的 CA 指紋、8444 的鏈尾、issued 的 ca_pem；未設定時 8444 不監聽
crl_validity_days = 30        # Kairos 產生的 CRL 的 nextUpdate
crl_refresh_hours = 24        # 每 24 小時與每次撤銷重新產生 CRL
organization = "Kairos"       # 簽發 CA 的 subject：CN=<organization> Kairos Agent Issuing CA <ca_id>
# issuing_ca_warning_days = 455   # 簽發 CA 剩餘天數低於此值時 KRS-W1304；未設定為政策有效天數＋寬限期

[pki.policy]                  # 憑證政策（主控台修改的值存在資料庫、優先於這裡；kairos config show --effective 查看來源）
cert_lifetime_days = 365      # 90..=825
renew_before_days = 30        # 到期前幾天經 8443 輪替
renew_requires_approval = false
expired_renew_grace_days = 90 # 過期寬限期（0 = 不接受過期續簽）
revoke_on_self_decommission = true
revoke_superseded = true      # 新憑證第一次連線後以 superseded 撤銷舊憑證

[alerts]                      # 告警引擎（kairos/ALERTS.md）；需要 storage.backend = "sqlite"。規則、靜音與通知管道存在資料庫，以主控台 API 或 kairos alerts／silences／alert-rules 管理
                              # 通知管道的機密以 data/alerts-secrets.key 加密（kairos db backup 不含；備份與還原時一起複製，INSTALL 第 10.2 節）
enabled = true                # false：不啟動告警引擎（告警端點回 503 alerts_unavailable）
console_url = ""              # 通知中的事件連結，例如 "https://monitor.example.com"；空字串時通知不附連結
timezone = "+08:00"           # 通知的時間與事件編號的日期：固定位移（+08:00、UTC），不支援時區名稱；管道可另外設定 timezone
warmup_secs = 600             # 啟動後的告警暖機期（60..=3600）：期間不發主機離線通知，重新啟動前在線上的主機 98% 重新連上時提早結束
retention_days = 400          # 已解決事件（含處理紀錄、發送紀錄）的保留天數，1..=3660
max_events = 100000           # 事件筆數上限（超過時刪除最舊的已解決事件），1000..=10000000；一個事件約 1～2 KB
subnet_prefix_v4 = 24         # 網段彙總（網段離線）的遮罩，8..=32
subnet_prefix_v6 = 64         # 32..=128
[accounts]                    # 主控台的本機帳號、密碼政策、登入失敗鎖定與工作階段（API.md 第 12 節）；首位管理員以 kairos users create <帳號> --role admin 建立
password_min_length = 12      # 密碼至少幾個字元，8..=128
lockout_threshold = 5         # 連續登入失敗幾次後鎖定（KRS-E6003），1..=100；不存在的帳號回應相同
lockout_minutes = 15          # 鎖定幾分鐘，1..=1440
session_idle_minutes = 30     # 工作階段閒置逾時（分鐘），5..=1440，不可大於絕對逾時
session_absolute_hours = 12   # 工作階段從登入起最長幾小時，1..=168
argon2_memory_kib = 19456     # 密碼雜湊 Argon2id 的記憶體成本（KiB），8192..=1048576；調整後舊雜湊仍可驗證，下次登入時以新參數重新雜湊
argon2_iterations = 2         # 1..=10
argon2_parallelism = 1        # 1..=8
mfa_issuer = "Kairos"         # TOTP 驗證器 App 顯示的發行者名稱

[ldap]                        # 目錄服務（LDAP／AD）登入；群組對應角色以 kairos users map-group 或主控台設定（存在資料庫）
enabled = false
# url = "ldaps://dc01.example.gov.tw:636"          # ldaps://；ldap:// 需搭配 starttls = true
# fallback_urls = ["ldaps://dc02.example.gov.tw:636"]
# starttls = false
# allow_plaintext = false     # 允許未加密的 ldap://（密碼以明文經過網路；不建議）
# ca_file = "/opt/kairos/ad-ca.pem"                # 簽發網域控制站憑證的 CA（PEM）；使用 TLS 時必填，伺服器憑證一律驗證
# bind_dn = "CN=svc-kairos,OU=Service,DC=example,DC=gov,DC=tw"
# bind_password_file = "/opt/kairos/ldap-bind.secret"   # 服務帳號的密碼檔（chown kairos、chmod 600）；密碼不寫在本檔
# user_base = "OU=Staff,DC=example,DC=gov,DC=tw"
# user_filter = "(&(objectCategory=person)(objectClass=user))"   # 預設只比對人員（排除 AD 的電腦帳號）
# login_attribute = "sAMAccountName"
# display_name_attribute = "displayName"
# email_attribute = "mail"
# group_attribute = "memberOf"
# timeout_secs = 10

[audit]                       # 稽核日誌（雜湊鏈；kairos audit verify|list|export）
retention_days = 1095         # 保留天數（預設 3 年，獨立於 report 的保留天數），90..=36500
anchor_log_minutes = 60       # 每隔幾分鐘把鏈尾雜湊寫一行到日誌（audit.chain_anchor；經 syslog 外送），0 不寫，5..=1440
verify_interval_hours = 24    # 每隔幾小時自我驗證雜湊鏈與 HMAC（失敗：KRS-E6201＋「稽核日誌完整性」緊急事件），1..=168
