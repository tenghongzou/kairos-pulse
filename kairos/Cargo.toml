[package]
name = "kairos"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
fern = { version = "0.7", features = ["date-based"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
log = "0.4"
# 檢查 mTLS 客戶端憑證的 SAN；與 rustls 依賴的版本相同，只啟用 alloc（不引入其他加密後端）
rustls-webpki = { version = "0.103.15", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# 使用 ring 作為加密後端，避免 aws-lc-rs 在 Windows 上需要額外的 C 建置工具
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
tokio-util = { version = "0.7", features = ["codec"] }
