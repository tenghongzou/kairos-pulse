[package]
name = "kairos"
version = "0.9.0"
edition = "2024"
rust-version = "1.99"
# 商業產品，不發佈到 crates.io（cargo-deny 因此略過本套件的授權欄位檢查）
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
# 日誌按 UTC 日期分檔由 logger::DailyLogFile 處理（需要指定新檔案的權限），不使用 fern 的 date-based
fern = "0.7"
# 與 Pulse 共用的時鐘跳躍保護（workspace 內部 crate）
date-guard = { path = "../crates/date-guard" }
# 與 Pulse／Kairos 共用的可觀測性元件：日誌格式、syslog、Prometheus 文字格式、診斷包（workspace 內部 crate）
kp-obs = { path = "../crates/kp-obs" }
# 與 Pulse 共用的協定型別與驗證（workspace 內部 crate）
kairos-proto = { path = "../crates/kairos-proto" }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# 主控台 API（kairos/API.md 第 8 節）：只啟用 HTTP/1.1；TLS 沿用 tokio-rustls。
# client：告警的 Webhook 通知（kairos/ALERTS.md），只用 hyper::client::conn::http1（一個請求一條連線）
hyper = { version = "1", default-features = false, features = ["server", "client", "http1"] }
# hyper 與 tokio 之間的 I/O 與計時器轉接（TokioIo、TokioTimer）
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
log = { version = "0.4", features = ["kv"] }
# report 與主機清冊的 SQLite 儲存（A1、A6、A9）。bundled：編譯內附的 SQLite（public domain），
# 不依賴系統的 libsqlite3，musl 靜態連結與 Windows 都不需額外安裝
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
# 註冊通道（8444）的簽發器：依範本簽發用戶端憑證、產生 CRL、產生簽發 CA 的金鑰與 CSR
# （crates/kairos-proto/ENROLL.md 第 15.3 節選定；以 ring 為後端，不引入 aws-lc-rs）
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }
# API token 的 SHA-256、常數時間比對與隨機數；與 rustls 使用的加密後端是同一個（已在依賴樹中）
ring = "0.17"
# API token 雜湊的常數時間比較（rustls 已依賴同一版本，不新增套件）
subtle = { version = "2", default-features = false }
# 金鑰與備份密碼在記憶體中用完即清除（rustls 已依賴同一版本，不新增套件）
zeroize = { version = "1", default-features = false, features = ["alloc"] }
# 檢查 mTLS 客戶端憑證的 SAN；與 rustls 依賴的版本相同，只啟用 alloc（不引入其他加密後端）
rustls-webpki = { version = "0.103.15", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rcgen 的日期型別（憑證的 notBefore／notAfter、CRL 的 thisUpdate／nextUpdate）；rcgen 已依賴同一版本
time = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["full"] }
# 告警通知（Webhook、SMTP）驗證外部伺服器憑證時使用作業系統的信任清單；Pulse 已依賴同一版本
rustls-native-certs = "0.8"
# 使用 ring 作為加密後端，避免 aws-lc-rs 在 Windows 上需要額外的 C 建置工具
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
tokio-util = { version = "0.7", features = ["codec"] }
# 解析 CSR、憑證與 CRL 並以 ring 驗證 CSR 與舊憑證的簽章（ENROLL.md 第 15.3 節；rcgen 解析 CSR 時也使用它）
x509-parser = { version = "0.18", features = ["verify"] }
# 本機帳號的密碼雜湊（Argon2id，RustCrypto，純 Rust）。鹽由 ring 的 CSPRNG 產生，不啟用 rand／getrandom
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
# LDAP／AD 的 bind 驗證與群組查詢（純 Rust；TLS 用 rustls＋ring，與其他連接埠相同的加密後端，
# 伺服器憑證一律驗證，見 kairos/src/users/ldap.rs）
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }

[dev-dependencies]
# 測試以暫停的 tokio 時鐘執行（tokio::time::pause），不依賴實際時間；只啟用既有依賴的 feature，不引入新的 crate
tokio = { version = "1", features = ["full", "test-util"] }
