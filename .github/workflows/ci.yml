# CI（商業審計 D3、D4、D5、Q1）：Linux 與 Windows 上的格式、lint、測試（含端對端測試），cargo-deny 依賴檢查，
# 通過後才打包兩個產品的 Linux 發佈包（不簽章；簽章只在發佈者的機器上進行，見 RELEASING.md）。
# 工具鏈一律取自根目錄的 rust-toolchain.toml（1.99.0、rustfmt、clippy），不另外指定版本；
# 打包則在 packaging/build-release-common.sh 以 digest 固定的 docker image 中進行。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: fmt / clippy / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # 依 rust-toolchain.toml 安裝工具鏈與元件（runner 已內建 rustup）
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Pulse 的 fault-injection（只給 tests/systemd/ 的測試用建置，REMOTE.md 第 17.9.9 節）不是預設的 feature，
      # 上面的 clippy 不會編譯到它：另外檢查一次，避免這段程式無人發現地壞掉。正式發佈不開啟它
      # （package job 的「Verify release binaries are not test builds」）
      - name: cargo clippy (pulse, fault-injection test feature)
        if: runner.os == 'Linux'
        run: cargo clippy -p pulse --all-targets --locked --features fault-injection -- -D warnings

      # PostgreSQL 後端的測試（kairos/HA.md 第 5.2、23 節）：只在 Linux 上以容器啟動 PostgreSQL 14（Kairos 支援的
      # 最低主版本；映像檔固定到主版本）。Windows 的 runner 不能執行 Linux 容器，那裡的 PostgreSQL 測試會
      # 「明確略過」（測試在 stderr 印出原因）；較新的主版本由下面的 postgres-compat job 驗證。
      # 以 docker run 而不是 services：services 無法只套用在 matrix 中的一個作業系統
      - name: Start PostgreSQL 14
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run -d --name kairos-test-pg             -e POSTGRES_USER=kairos -e POSTGRES_PASSWORD=kairos -e POSTGRES_DB=kairos             -p 127.0.0.1:55432:5432 postgres:14-alpine
          for i in $(seq 1 60); do
            if docker exec kairos-test-pg pg_isready -U kairos -d kairos >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec kairos-test-pg psql -U kairos -d kairos -Atc 'select version()'
          # 設定後 PostgreSQL 的測試不可略過：連不上就失敗（KAIROS_TEST_PG_REQUIRED）
          echo "KAIROS_TEST_PG_URL=postgres://kairos:kairos@127.0.0.1:55432/kairos" >> "$GITHUB_ENV"
          echo "KAIROS_TEST_PG_REQUIRED=1" >> "$GITHUB_ENV"

      - name: cargo test
        run: cargo test --workspace --locked --exclude kp-e2e --no-fail-fast

      # 端對端測試（審計 Q1，tests/e2e）：以實際的 kairos、pulse 執行檔在 127.0.0.1 上以 mTLS 互連，
      # 不連外部網路。先在這一步建置執行檔（--locked），測試內的 cargo build 因此不需重新建置。
      # 每個等待都有逾時；Linux 上另含叢集的容錯移轉測試（tests/cluster.rs：兩個 Kairos＋Pulse＋PostgreSQL，
      # 要等 leader 租約到期，約 1～2 分鐘）。這裡的 timeout 只防止 runner 異常時卡住整個 job
      - name: Build binaries for end-to-end tests
        run: cargo build -p kairos -p pulse --bins --locked

      - name: End-to-end tests
        run: cargo test -p kp-e2e --locked --no-fail-fast
        timeout-minutes: 15

  # PostgreSQL 後端在較新的主版本上的相容性：只跑儲存層的測試（兩個後端共用的測試本體）與 PostgreSQL 的
  # 端對端測試。最低主版本 14 已在 check job 的 Linux 上跑過整套測試
  postgres-compat:
    name: store tests (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: kairos
          POSTGRES_PASSWORD: kairos
          POSTGRES_DB: kairos
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U kairos -d kairos"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      KAIROS_TEST_PG_URL: postgres://kairos:kairos@127.0.0.1:55432/kairos
      KAIROS_TEST_PG_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Store tests (SQLite and PostgreSQL)
        run: "cargo test -p kairos --locked --no-fail-fast store::"

      - name: Build binaries for end-to-end tests
        run: cargo build -p kairos -p pulse --bins --locked

      # tests/postgres.rs（單一節點）與 tests/cluster.rs（叢集：租約、fencing、容錯移轉）
      - name: End-to-end tests on PostgreSQL
        run: cargo test -p kp-e2e --locked --no-fail-fast --test postgres --test cluster
        timeout-minutes: 15

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          cargo --version

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      # advisories、bans、licenses、sources 全部檢查（設定見 deny.toml）
      - name: cargo deny check
        run: cargo deny check

  # 審計 D3 後半：打包前必須通過上面的 job（Linux／Windows 的 fmt、clippy、test、PostgreSQL 相容性與 cargo deny）
  package:
    name: package (linux x86_64/aarch64, windows x86_64)
    needs: [check, deny, postgres-compat]
    runs-on: ubuntu-latest
    steps:
      # 完整歷史與 tag：短 commit 的長度與 HEAD 上的 <名稱>-v* tag 檢查都和本機一致
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # runner 內建 shellcheck；-P SCRIPTDIR 讓產品腳本能追蹤到共用的 build-release-common.sh
      - name: shellcheck
        run: >-
          shellcheck -x -P SCRIPTDIR
          packaging/build-release-common.sh packaging/release.sh packaging/sign-release.sh
          packaging/check-reproducible.sh packaging/release-manifest.sh
          packaging/check-release-binary.sh
          kairos/packaging/build-release.sh pulse/packaging/build-release.sh
          pulse/packaging/install.sh kairos/packaging/pkg/*.sh pulse/packaging/pkg/*.sh

      # 檢查已由 check、deny job 完成；release.sh 會確認工作目錄乾淨、清除 dist/ 後打包兩個產品，
      # 產出合併版 SHA256SUMS。CI 沒有私鑰，不簽章。
      - name: Build release packages
        env:
          SKIP_CHECKS: "1"
        run: sh packaging/release.sh

      - name: Verify SHA256SUMS
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      # 發佈檔不得含測試用 feature（Pulse 的故障注入，REMOTE.md 第 17.9.9 節）的程式。打包腳本在建置時與
      # 打包後各檢查過一次；這裡對要上傳的檔案再檢查一次（tar.gz、zip、deb 內的執行檔），並確認 release.sh
      # 在設定了 TEST_FEATURES 時拒絕執行
      - name: Verify release binaries are not test builds
        run: |
          sh packaging/check-release-binary.sh --archive dist/*.tar.gz dist/*.zip dist/*.deb
          if TEST_FEATURES=fault-injection SKIP_CHECKS=1 sh packaging/release.sh; then
            echo "release.sh 應該拒絕 TEST_FEATURES" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.zip
            dist/*.msi
            dist/*.cdx.json
            dist/pulse-install.sh
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  # 審計 D4：以兩個全新的 docker volume 各建置一次並比對雜湊。從頭編譯兩次約需 15 分鐘，
  # 只在 main 與手動觸發時執行，不擋 PR。
  reproducible:
    name: reproducible build check
    needs: [check, deny]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build twice and compare
        run: sh packaging/check-reproducible.sh

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reproducible-logs-${{ github.sha }}
          path: dist/repro/
          retention-days: 14
