[package]
name = "kairos-proto"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Pulse ↔ Kairos 協定（v1、v2）與註冊通道（8444，ENROLL.md）的共用型別、序列化、版本協商、欄位驗證與簽章內容，指標擴充（METRICS.md）的行程排行、主機資產，以及遠端管理（REMOTE.md）的訊息、設定白名單與發佈包簽章驗證（兩個產品共用，規格見 PROTOCOL.md、ENROLL.md、METRICS.md、REMOTE.md）"
# 內部共用 crate，不發佈到 crates.io（cargo-deny 因此略過本套件的授權欄位檢查）
publish = false

[dependencies]
# 只用 workspace 既有的依賴；不依賴 tokio 等執行環境，codec 與 I/O 留在各產品
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 註冊通道（ENROLL.md）的 RFC 3339 時間解析與 server_time 格式；與 kairos、pulse 同一版本，
# 不啟用 clock（本 crate 不讀系統時間，現在時間由呼叫端傳入）
chrono = { version = "0.4", default-features = false, features = ["std"] }
# 註冊通道的 SHA-256（CA 指紋、申請編號、token 雜湊、重放快取鍵）與 ECDSA P-256 簽章驗證／簽章；
# 遠端升級（REMOTE.md）的 SSHSIG 驗證（Ed25519、SHA-512）。與 rustls、kairos 使用的加密後端是同一個
# （已在依賴樹中，不新增套件；不呼叫系統的 ssh-keygen）
ring = "0.17"

[dev-dependencies]
# 只供測試（ENROLL.md「CSR 與憑證的套件」）：以兩端實作時選定的套件產生與解析 CSR，確認測試向量的
# SPKI、SAN 與 CSR 雜湊與本 crate 的函式一致。兩者皆 MIT OR Apache-2.0，以 ring 為加密後端
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }
x509-parser = { version = "0.18", features = ["verify"] }
