[package]
name = "date-guard"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "依日期命名的檔案在保留清除前的時鐘跳躍／回撥保護（Kairos 的 report 與日誌、Pulse 的日誌共用）"
# 內部共用 crate，不發佈到 crates.io（cargo-deny 因此略過本套件的授權欄位檢查）
publish = false

[dependencies]
# 只用 workspace 既有的依賴；不讀寫狀態檔、不記日誌，I/O 與日誌措辭留在各產品
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
